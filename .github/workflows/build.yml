name: Build

# Builds BH.dll (Release|Win32) with MSVC on every pull request and push to main,
# so a change that breaks the build is caught before it is merged. The built DLL is
# attached to each run as a downloadable artifact for testing. A second job builds
# and runs the unit tests (tests/BH.Tests.vcxproj); any failing test fails the run.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msvc:
    name: MSVC Release|Win32
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        # The project's post-build step copies the output into $(DIABLO_DEBUG_FOLDER)
        # (a developer's game folder); point it at a scratch directory in CI.
        shell: pwsh
        run: |
          $env:DIABLO_DEBUG_FOLDER = Join-Path $env:RUNNER_TEMP 'diablo'
          New-Item -ItemType Directory -Force -Path $env:DIABLO_DEBUG_FOLDER | Out-Null
          msbuild BH.sln /m /p:Configuration=Release /p:Platform=Win32

      - name: Upload BH.dll
        uses: actions/upload-artifact@v4
        with:
          name: BH-${{ github.sha }}
          path: |
            **/Release/BH.dll
            **/Release/BH.pdb
          if-no-files-found: error

  tests:
    name: Unit tests (MSVC Release|Win32)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build tests
        run: msbuild tests/BH.Tests.vcxproj /m /p:Configuration=Release /p:Platform=Win32

      - name: Run tests
        working-directory: tests
        run: bin\Release\BH.Tests.exe --duration=false

      - name: Write JUnit report
        if: always()
        working-directory: tests
        # Same tests again, written as JUnit XML for the artifact. Pass/fail is decided by
        # the previous step, so this one never fails on its own.
        run: |
          bin\Release\BH.Tests.exe --reporters=junit --out=junit.xml
          exit 0

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.sha }}
          path: tests/junit.xml
          if-no-files-found: ignore
